name: "CodeQL"

on:
  push:
    branches: [ main, 'feature/*', 'my-branch' ]  # Add your branch pattern
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ python ]  # Add more if needed, e.g., javascript

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Optional: Customize queries for more vulns
        # queries: security-and-quality

    # For Python (interpreted language), no build needed
    # If you had compiled code, add autobuild step here

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3